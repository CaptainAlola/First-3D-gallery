<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка модели</title>
    <!-- ВАЖНО: Импортмап для three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        .btn { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 6px; }
        .btn:hover { background-color: #0056b3; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #preview-container { border: 2px dashed #ccc; }
    </style>
</head>
<body>
    <header>
        <h1>Загрузить новую 3D модель</h1>
        <a href="{% url 'home' %}" class="btn" style="background-color: #6c757d; margin-left: 8px;">← Вернуться в галерею</a>
    </header>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <!-- БЛОК ПРЕВЬЮ (новый) -->
        <div style="margin-bottom: 20px;">
            <p>Авто-генерация превью:</p>
            <div id="preview-container" style="width: 300px; height: 200px; background: #eee; display: flex; align-items: center; justify-content: center;">
                <span style="display: block; text-align: center; color: #999;">Выберите файл...</span>
            </div>
            <input type="hidden" name="image_data" id="id_image_data">
        </div>
        <button type="submit" class="btn" id="submit-btn">📤 Загрузить файл</button>
    </form>

    <script type="module">
        import { generateThumbnail } from "{% static 'gallery/js/autothumb.js' %}";
        
        const fileInput = document.querySelector('input[type="file"]');
        const previewContainer = document.getElementById('preview-container');
        const imageDataInput = document.getElementById('id_image_data');
        const submitBtn = document.getElementById('submit-btn');
        
        if (fileInput) {
            fileInput.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Генерирую превью...';
                
                try {
                    const imageData = await generateThumbnail(file);
                    imageDataInput.value = imageData;
                    
                    // Показываем превью
                    previewContainer.innerHTML = `<img src="${imageData}" style="width: 100%; height: 100%; object-fit: cover;">`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 Загрузить файл';
                } catch (error) {
                    console.error('Ошибка генерации превью:', error);
                    previewContainer.innerHTML = `<span style="color: red;">❌ Ошибка обработки файла</span>`;
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 Загрузить файл';
                }
            });
        }
    </script>
    <footer>
        <p>&copy; 2024 Web Structures Course</p>
    </footer>
</body>
</html>
